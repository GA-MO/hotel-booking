# Hotel Booking API — OpenAPI 3.1 specification
#
# Hand-traced from:
#   apps/api/internal/platform/server/server.go  (route wiring)
#   apps/api/internal/{auth,hotel,roomtype,landing,pricing,booking,notification,subscription}/handler.go + types.go
#   apps/api/internal/platform/respond/respond.go (error envelope)
#
# Routes fully traced from the routes() function in server.go and the
# per-module Routes()/AttachTo()/PublicRoutes() functions. Schemas mirror the
# Go DTOs in each module's types.go.
#
# Verification needed (low-risk, but flagged here):
#   - landing.LandingPage uses Branding/SEO/Tracking subtypes — modelled inline; if
#     the JSON serializer wraps them differently in practice, regenerate types.
#   - pricing.UpdateRuleRequest does NOT include room_type_id (intentional: see types.go).
#   - subscription "admin-only" suspend/terminate/reactivate operations are intentionally
#     omitted (not wired in handler.go).
#   - notification POST /test enqueues + best-effort syncs; we model the response as
#     a Notification regardless.
#   - GET /v1/public/quote/{slug} uses POST (handler is `r.Post("/{slug}", ...)`).
#
openapi: 3.1.0

info:
  title: Hotel Booking API
  version: 0.1.0
  description: |
    Backend HTTP API for the Hotel Booking SaaS. Powers the booking-web
    (guest-facing) and admin-web (operator-facing) Next.js apps.

    All authenticated endpoints expect a JWT access token in the
    `Authorization: Bearer <token>` header. Error responses use a shared
    envelope: `{ "error": { "code": "STRING", "message": "STRING" } }`.

    Money fields ending in `_cents` are integers in the currency's minor unit
    (e.g. THB satang); decimal-string fields (`rate`, `amount`, etc.) are
    used when JS precision matters.
  contact:
    name: Hotel Booking Engineering
    email: engineering@example.com

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.example.com
    description: Production

tags:
  - name: health
    description: Liveness and readiness probes.
  - name: auth
    description: Account signup, login, refresh, logout, and identity.
  - name: hotels
    description: Top-level hotel CRUD scoped to the caller's account.
  - name: room-types
    description: Sellable room categories owned by a hotel.
  - name: photos
    description: Image attachments for hotels and room types.
  - name: landing
    description: Per-locale landing-page content authored by hotel staff.
  - name: availability
    description: Per-day inventory and rate overrides.
  - name: pricing-rules
    description: Modifier rules applied during rate computation.
  - name: bookings
    description: Reservation lifecycle (staff-facing).
  - name: public
    description: Unauthenticated guest-facing endpoints.
  - name: notifications
    description: Outbox for email/LINE/SMS messages.
  - name: subscription
    description: Account-scoped subscription and billing state.
  - name: uploads
    description: Presigned-URL image upload pipeline (MinIO/B2) + imgproxy delivery URL signing.

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      description: Returns 200 if the process is running. No dependencies checked.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /readyz:
    get:
      tags: [health]
      summary: Readiness probe
      description: Pings the database and Redis; returns 503 if either is unreachable.
      security: []
      responses:
        '200':
          description: All dependencies healthy
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: string }
        '503':
          description: One or more dependencies down
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: string }

  /v1/ping:
    get:
      tags: [health]
      summary: Debug ping
      description: Returns a static pong response. Useful for smoke tests.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pong: { type: string, example: ok }

  # ----- auth -----

  /v1/auth/signup:
    post:
      tags: [auth]
      summary: Create a new account and owner user
      description: Creates an account + owner user and returns a token pair. A
        subscription row is auto-provisioned via the post-signup hook.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/auth/login:
    post:
      tags: [auth]
      summary: Exchange email + password for a token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate a refresh token for a new access + refresh pair
      description: The old refresh token is revoked and replaced. Re-use of an
        already-rotated token returns 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Rotated token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke a refresh token
      description: Idempotent. Always returns 204 (or 401 on invalid token).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204': { description: Token revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/auth/me:
    get:
      tags: [auth]
      summary: Return the authenticated user
      responses:
        '200':
          description: Authenticated identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ----- hotels (top-level) -----

  /v1/hotels:
    get:
      tags: [hotels]
      summary: List hotels owned by the caller's account
      responses:
        '200':
          description: Hotel list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HotelListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [hotels]
      summary: Create a hotel (owner / manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HotelCreateRequest' }
      responses:
        '201':
          description: Hotel created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hotel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/hotels/slug-available:
    get:
      tags: [hotels]
      summary: Check whether a public slug is unused
      parameters:
        - in: query
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Availability flag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlugAvailableResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/hotels/{id}:
    parameters:
      - $ref: '#/components/parameters/HotelIdPath'
    get:
      tags: [hotels]
      summary: Get a hotel by id
      responses:
        '200':
          description: Hotel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hotel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [hotels]
      summary: Partial update (owner / manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HotelUpdateRequest' }
      responses:
        '200':
          description: Updated hotel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hotel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [hotels]
      summary: Soft-delete a hotel (owner only)
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ----- room types -----

  /v1/hotels/{hotel_id}/room-types:
    parameters:
      - $ref: '#/components/parameters/HotelIdPathSegment'
    get:
      tags: [room-types]
      summary: List room types for a hotel
      responses:
        '200':
          description: Room type list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomTypeListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [room-types]
      summary: Create a room type (owner / manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomTypeCreateRequest' }
      responses:
        '201':
          description: Room type created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomType' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/hotels/{hotel_id}/room-types/{id}:
    parameters:
      - $ref: '#/components/parameters/HotelIdPathSegment'
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [room-types]
      summary: Get a room type
      responses:
        '200':
          description: Room type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [room-types]
      summary: Update a room type (owner / manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomTypeUpdateRequest' }
      responses:
        '200':
          description: Updated room type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomType' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [room-types]
      summary: Delete a room type (owner only)
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ----- room-type photos -----

  /v1/hotels/{hotel_id}/room-types/{id}/photos:
    parameters:
      - $ref: '#/components/parameters/HotelIdPathSegment'
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [photos]
      summary: List photos attached to a room type
      responses:
        '200':
          description: Photo list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [photos]
      summary: Attach a photo to a room type (owner / manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhotoCreateRequest' }
      responses:
        '201':
          description: Photo attached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Photo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/hotels/{hotel_id}/room-types/{id}/photos/{photo_id}:
    parameters:
      - $ref: '#/components/parameters/HotelIdPathSegment'
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/PhotoIdPath'
    patch:
      tags: [photos]
      summary: Update photo metadata (owner / manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhotoUpdateRequest' }
      responses:
        '200':
          description: Updated photo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Photo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [photos]
      summary: Detach a photo from a room type (owner / manager)
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ----- hotel-level photos -----

  /v1/hotels/{hotel_id}/photos:
    parameters:
      - $ref: '#/components/parameters/HotelIdPathSegment'
    get:
      tags: [photos]
      summary: List hotel-level photos
      responses:
        '200':
          description: Photo list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [photos]
      summary: Attach a photo to a hotel (owner / manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhotoCreateRequest' }
      responses:
        '201':
          description: Photo attached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Photo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/hotels/{hotel_id}/photos/{photo_id}:
    parameters:
      - $ref: '#/components/parameters/HotelIdPathSegment'
      - $ref: '#/components/parameters/PhotoIdPath'
    delete:
      tags: [photos]
      summary: Detach a photo from a hotel (owner / manager)
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ----- landing (admin) -----

  /v1/hotels/{hotel_id}/landing:
    parameters:
      - $ref: '#/components/parameters/HotelIdPathSegment'
    get:
      tags: [landing]
      summary: List landing pages (one per locale) for a hotel
      responses:
        '200':
          description: Landing page list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LandingListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/hotels/{hotel_id}/landing/{locale}:
    parameters:
      - $ref: '#/components/parameters/HotelIdPathSegment'
      - $ref: '#/components/parameters/LocalePath'
    get:
      tags: [landing]
      summary: Get a landing page (any status) for a locale
      responses:
        '200':
          description: Landing page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LandingPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [landing]
      summary: Upsert (full replacement of) draft content (owner / manager)
      description: Writes a draft. Sections/branding/seo/tracking are fully replaced.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LandingUpdateRequest' }
      responses:
        '200':
          description: Saved draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LandingPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [landing]
      summary: Delete a landing page (owner only)
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/hotels/{hotel_id}/landing/{locale}/publish:
    parameters:
      - $ref: '#/components/parameters/HotelIdPathSegment'
      - $ref: '#/components/parameters/LocalePath'
    post:
      tags: [landing]
      summary: Publish the current draft (owner / manager)
      responses:
        '200':
          description: Published page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LandingPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/hotels/{hotel_id}/landing/{locale}/unpublish:
    parameters:
      - $ref: '#/components/parameters/HotelIdPathSegment'
      - $ref: '#/components/parameters/LocalePath'
    post:
      tags: [landing]
      summary: Unpublish a published page (owner only)
      responses:
        '200':
          description: Page reverted to draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LandingPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ----- availability -----

  /v1/hotels/{hotel_id}/availability:
    parameters:
      - $ref: '#/components/parameters/HotelIdPathSegment'
    get:
      tags: [availability]
      summary: Get per-day availability + computed rates over a date range
      parameters:
        - in: query
          name: start
          required: true
          schema: { type: string, format: date }
        - in: query
          name: end
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Availability response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [availability]
      summary: Upsert availability/rate/restriction overrides (owner / manager)
      description: Batched upsert keyed by (room_type_id, date). Sparse — only
        provided rows are written.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertAvailabilityRequest' }
      responses:
        '204': { description: Saved }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [availability]
      summary: Delete a single availability override (owner / manager)
      parameters:
        - in: query
          name: room_type_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: date
          required: true
          schema: { type: string, format: date }
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ----- pricing rules -----

  /v1/hotels/{hotel_id}/pricing-rules:
    parameters:
      - $ref: '#/components/parameters/HotelIdPathSegment'
    get:
      tags: [pricing-rules]
      summary: List pricing rules for a hotel
      responses:
        '200':
          description: Pricing rule list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [pricing-rules]
      summary: Create a pricing rule (owner / manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRuleRequest' }
      responses:
        '201':
          description: Created rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/hotels/{hotel_id}/pricing-rules/{id}:
    parameters:
      - $ref: '#/components/parameters/HotelIdPathSegment'
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [pricing-rules]
      summary: Update a pricing rule (owner / manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRuleRequest' }
      responses:
        '200':
          description: Updated rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [pricing-rules]
      summary: Delete a pricing rule (owner / manager)
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ----- bookings (staff) -----

  /v1/hotels/{hotel_id}/bookings:
    parameters:
      - $ref: '#/components/parameters/HotelIdPathSegment'
    get:
      tags: [bookings]
      summary: List bookings for a hotel (optionally filtered by status)
      parameters:
        - in: query
          name: status
          required: false
          schema: { $ref: '#/components/schemas/BookingStatus' }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        '200':
          description: Booking list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [bookings]
      summary: Create a walk-in / phone booking (owner / manager / front_desk)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingCreateRequest' }
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/hotels/{hotel_id}/bookings/{id}:
    parameters:
      - $ref: '#/components/parameters/HotelIdPathSegment'
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [bookings]
      summary: Get a booking by id (scoped to caller's account)
      responses:
        '200':
          description: Booking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/hotels/{hotel_id}/bookings/{id}/confirm:
    parameters:
      - $ref: '#/components/parameters/HotelIdPathSegment'
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [bookings]
      summary: Confirm a pending booking (owner / manager / front_desk)
      responses:
        '200':
          description: Confirmed booking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/hotels/{hotel_id}/bookings/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/HotelIdPathSegment'
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [bookings]
      summary: Cancel a booking by staff (owner / manager / front_desk)
      description: Body is optional. When provided, `reason` is stored on the booking.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingCancelRequest' }
      responses:
        '200':
          description: Cancelled booking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/hotels/{hotel_id}/bookings/{id}/check-in:
    parameters:
      - $ref: '#/components/parameters/HotelIdPathSegment'
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [bookings]
      summary: Check a guest in (owner / manager / front_desk)
      responses:
        '200':
          description: Checked-in booking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/hotels/{hotel_id}/bookings/{id}/check-out:
    parameters:
      - $ref: '#/components/parameters/HotelIdPathSegment'
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [bookings]
      summary: Check a guest out (owner / manager / front_desk)
      responses:
        '200':
          description: Checked-out booking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/hotels/{hotel_id}/bookings/{id}/no-show:
    parameters:
      - $ref: '#/components/parameters/HotelIdPathSegment'
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [bookings]
      summary: Mark a booking as no-show (owner / manager)
      responses:
        '200':
          description: No-show booking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ----- subscription -----

  /v1/subscription:
    get:
      tags: [subscription]
      summary: Get the caller account's subscription
      responses:
        '200':
          description: Subscription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/subscription/payment-method:
    post:
      tags: [subscription]
      summary: Update / set the payment method (owner only)
      description: Stores a gateway-provided token verbatim. NO server-side
        gateway call — the SDK in the browser is the source of truth.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePaymentMethodRequest' }
      responses:
        '200':
          description: Updated subscription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/subscription/cancel:
    post:
      tags: [subscription]
      summary: Cancel the subscription (owner only)
      description: Body is optional; when provided, `reason` is stored on the row.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionCancelRequest' }
      responses:
        '200':
          description: Cancelled subscription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ----- notifications -----

  /v1/notifications:
    get:
      tags: [notifications]
      summary: List recent notifications (owner / manager)
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        '200':
          description: Notification list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/notifications/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [notifications]
      summary: Get a notification by id (owner / manager)
      responses:
        '200':
          description: Notification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/notifications/test:
    post:
      tags: [notifications]
      summary: Enqueue a test notification (owner only)
      description: Enqueues + best-effort synchronously dispatches a single
        notification. Useful for operator validation of email/LINE wiring.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnqueueRequest' }
      responses:
        '201':
          description: Enqueued notification (status will be `queued`, `sent`, or `failed` depending on sender state)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Template render failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: Sender unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ----- uploads -----

  /v1/uploads/presign:
    post:
      tags: [uploads]
      summary: Get a presigned PUT URL to upload an image directly to storage
      description: |
        Returns a time-limited (15 min) presigned S3 SigV4 URL bound to a
        server-generated object key. The browser PUTs the file directly to
        storage using the URL + the returned headers, then POSTs the
        `public_url` to one of the existing photo endpoints (e.g.
        `POST /v1/hotels/{hotel_id}/photos` or `.../room-types/{id}/photos`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresignRequest' }
      responses:
        '200':
          description: Presigned upload URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PresignResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: Object storage is not configured on this server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/uploads/imgproxy-url:
    post:
      tags: [uploads]
      summary: Sign an imgproxy delivery URL for a given source image
      description: |
        Returns a signed imgproxy URL of the form
        `{base}/{signature}/{processing_options}/{base64url(source_url)}`.
        Signing happens server-side so `IMGPROXY_KEY`/`IMGPROXY_SALT` stay
        secret. Falls back to imgproxy's `insecure` mode if key/salt are
        unset (dev only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImgproxyRequest' }
      responses:
        '200':
          description: Signed delivery URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImgproxyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: imgproxy is not configured on this server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ----- public (unauthenticated) -----

  /v1/public/landing/{slug}/{locale}:
    parameters:
      - $ref: '#/components/parameters/SlugPath'
      - $ref: '#/components/parameters/LocalePath'
    get:
      tags: [public, landing]
      summary: Get the published landing page for a slug + locale
      description: Only returns rows where status='published' and the hotel
        is live. Used by booking-web's ISR build step.
      security: []
      responses:
        '200':
          description: Published landing page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicLandingResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/public/quote/{slug}:
    parameters:
      - $ref: '#/components/parameters/SlugPath'
    post:
      tags: [public, pricing-rules]
      summary: Compute a guest-facing price quote
      description: Public endpoint used by booking-web's checkout flow. Applies
        room-type base rate, overrides, and pricing rules; multiplies by `rooms`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '200':
          description: Quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/public/bookings/{reference}:
    parameters:
      - $ref: '#/components/parameters/ReferencePath'
    get:
      tags: [public, bookings]
      summary: Look up a booking by reference + guest email
      description: Email is required as a soft auth check. Returns 404 on mismatch.
      security: []
      parameters:
        - in: query
          name: email
          required: true
          schema: { type: string, format: email }
      responses:
        '200':
          description: Booking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/public/bookings/{reference}/cancel:
    parameters:
      - $ref: '#/components/parameters/ReferencePath'
    post:
      tags: [public, bookings]
      summary: Guest-initiated cancel by reference + email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicBookingCancelRequest' }
      responses:
        '200':
          description: Cancelled booking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/public/hotels/{slug}/bookings:
    parameters:
      - $ref: '#/components/parameters/SlugPath'
    post:
      tags: [public, bookings]
      summary: Create a guest booking by hotel slug
      description: Only hotels with status='live' accept public bookings.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingCreateRequest' }
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token issued by /v1/auth/login or /v1/auth/refresh.

  parameters:
    HotelIdPath:
      in: path
      name: id
      required: true
      description: Hotel id
      schema: { type: string, format: uuid }
    HotelIdPathSegment:
      in: path
      name: hotel_id
      required: true
      description: Hotel id (parent path segment for sub-resources)
      schema: { type: string, format: uuid }
    IdPath:
      in: path
      name: id
      required: true
      description: Resource id
      schema: { type: string, format: uuid }
    PhotoIdPath:
      in: path
      name: photo_id
      required: true
      description: Photo id
      schema: { type: string, format: uuid }
    LocalePath:
      in: path
      name: locale
      required: true
      description: BCP-47-ish locale (e.g. `th`, `en`, `en-US`)
      schema: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$' }
    SlugPath:
      in: path
      name: slug
      required: true
      description: Public hotel slug
      schema: { type: string, minLength: 3, maxLength: 80, pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$' }
    ReferencePath:
      in: path
      name: reference
      required: true
      description: Booking reference (e.g. `BK-XXXXXXXX`)
      schema: { type: string }

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Missing or invalid credentials / token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Caller's role does not permit this action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found (or hidden by tenant isolation)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: State / uniqueness conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    # ----- error envelope -----

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine code (e.g. NOT_FOUND, BAD_REQUEST)
            message: { type: string }

    # ----- auth -----

    User:
      type: object
      required: [id, account_id, email, name, role, locale, created_at]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role:
          type: string
          enum: [owner, manager, front_desk, read_only]
        locale: { type: string }
        email_verified_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    SignupRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        name: { type: string }
        locale: { type: string }
        country: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    AuthResponse:
      type: object
      required: [user, access_token, refresh_token, access_token_expires_in]
      properties:
        user: { $ref: '#/components/schemas/User' }
        access_token: { type: string }
        refresh_token: { type: string }
        access_token_expires_in:
          type: integer
          description: Seconds until access token expiry

    MeResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }

    # ----- hotel -----

    Hotel:
      type: object
      required: [id, account_id, slug, name, timezone, base_currency, check_in_time, check_out_time, kyc_status, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        hotel_type: { type: string }
        description: { type: string }
        address_line: { type: string }
        city: { type: string }
        country: { type: string }
        postal_code: { type: string }
        latitude: { type: [number, 'null'], format: double }
        longitude: { type: [number, 'null'], format: double }
        phone: { type: string }
        email: { type: string, format: email }
        line_id: { type: string }
        timezone: { type: string }
        base_currency: { type: string, description: ISO 4217 code }
        check_in_time: { type: string, description: 'HH:MM:SS' }
        check_out_time: { type: string, description: 'HH:MM:SS' }
        kyc_status:
          type: string
          enum: [pending, submitted, approved, rejected]
        status:
          type: string
          enum: [test, live, suspended, archived]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    HotelCreateRequest:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
        hotel_type: { type: string }
        country: { type: string }
        timezone: { type: string }
        base_currency: { type: string }

    HotelUpdateRequest:
      type: object
      description: Partial PATCH; only non-null fields are written. Slug is intentionally not updatable here.
      properties:
        name: { type: [string, 'null'] }
        hotel_type: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        address_line: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        country: { type: [string, 'null'] }
        postal_code: { type: [string, 'null'] }
        latitude: { type: [number, 'null'], format: double }
        longitude: { type: [number, 'null'], format: double }
        phone: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        line_id: { type: [string, 'null'] }
        timezone: { type: [string, 'null'] }
        base_currency: { type: [string, 'null'] }
        check_in_time: { type: [string, 'null'] }
        check_out_time: { type: [string, 'null'] }

    HotelListResponse:
      type: object
      required: [hotels]
      properties:
        hotels:
          type: array
          items: { $ref: '#/components/schemas/Hotel' }

    SlugAvailableResponse:
      type: object
      required: [slug, available]
      properties:
        slug: { type: string }
        available: { type: boolean }

    # ----- room type -----

    RoomType:
      type: object
      required: [id, hotel_id, name, total_inventory, max_occupancy, bed_config, amenities, base_rate, base_currency, display_order, enabled, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        hotel_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        total_inventory: { type: integer, minimum: 0 }
        max_occupancy: { type: integer, minimum: 1 }
        size_sqm: { type: [number, 'null'], format: double }
        bed_config: { description: Opaque JSON document }
        amenities: { description: Opaque JSON document }
        base_rate: { type: number, format: double, minimum: 0 }
        base_currency: { type: string }
        display_order: { type: integer, minimum: 0 }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RoomTypeCreateRequest:
      type: object
      required: [name, total_inventory, max_occupancy, base_rate]
      properties:
        name: { type: string }
        description: { type: string }
        total_inventory: { type: integer, minimum: 0 }
        max_occupancy: { type: integer, minimum: 1 }
        size_sqm: { type: [number, 'null'], format: double }
        bed_config: { description: Opaque JSON document }
        amenities: { description: Opaque JSON document }
        base_rate: { type: number, format: double, minimum: 0 }
        base_currency: { type: string }
        display_order: { type: integer, minimum: 0 }

    RoomTypeUpdateRequest:
      type: object
      properties:
        name: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        total_inventory: { type: [integer, 'null'], minimum: 0 }
        max_occupancy: { type: [integer, 'null'], minimum: 1 }
        size_sqm: { type: [number, 'null'], format: double }
        bed_config: { description: Opaque JSON document }
        amenities: { description: Opaque JSON document }
        base_rate: { type: [number, 'null'], format: double, minimum: 0 }
        base_currency: { type: [string, 'null'] }
        display_order: { type: [integer, 'null'], minimum: 0 }
        enabled: { type: [boolean, 'null'] }

    RoomTypeListResponse:
      type: object
      required: [room_types]
      properties:
        room_types:
          type: array
          items: { $ref: '#/components/schemas/RoomType' }

    # ----- photo -----

    Photo:
      type: object
      required: [id, storage_key, display_order, is_cover, created_at]
      properties:
        id: { type: string, format: uuid }
        hotel_id: { type: [string, 'null'], format: uuid }
        room_type_id: { type: [string, 'null'], format: uuid }
        storage_key: { type: string }
        caption: { type: string }
        alt_text: { type: string }
        width: { type: [integer, 'null'], minimum: 0 }
        height: { type: [integer, 'null'], minimum: 0 }
        display_order: { type: integer, minimum: 0 }
        is_cover: { type: boolean }
        created_at: { type: string, format: date-time }

    PhotoCreateRequest:
      type: object
      required: [storage_key]
      properties:
        storage_key: { type: string }
        caption: { type: string }
        alt_text: { type: string }
        width: { type: [integer, 'null'], minimum: 0 }
        height: { type: [integer, 'null'], minimum: 0 }
        display_order: { type: integer, minimum: 0 }
        is_cover: { type: boolean }

    PhotoUpdateRequest:
      type: object
      properties:
        caption: { type: [string, 'null'] }
        alt_text: { type: [string, 'null'] }
        display_order: { type: [integer, 'null'], minimum: 0 }
        is_cover: { type: [boolean, 'null'] }

    PhotoListResponse:
      type: object
      required: [photos]
      properties:
        photos:
          type: array
          items: { $ref: '#/components/schemas/Photo' }

    # ----- landing -----

    Branding:
      type: object
      properties:
        logo_url: { type: string }
        primary_color: { type: string, description: '#RRGGBB hex' }
        accent_color: { type: string, description: '#RRGGBB hex' }
        font_family: { type: string }

    SEO:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        og_image_url: { type: string }

    Tracking:
      type: object
      properties:
        facebook_pixel_id: { type: string }
        google_analytics_id: { type: string }
        google_ads_conversion_id: { type: string }
        gtm_id: { type: string }
        line_tag_id: { type: string }
        tiktok_pixel_id: { type: string }

    Section:
      type: object
      required: [type, enabled, order, content]
      properties:
        type:
          type: string
          description: Section catalog key (hero | gallery | about | rooms | ...)
        enabled: { type: boolean }
        order: { type: integer }
        content:
          type: object
          additionalProperties: true
          description: Opaque per-section content payload

    LandingPage:
      type: object
      required: [id, hotel_id, locale, status, version, branding, sections, seo, tracking, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        hotel_id: { type: string, format: uuid }
        locale: { type: string }
        status:
          type: string
          enum: [draft, published]
        version: { type: integer, minimum: 0 }
        branding: { $ref: '#/components/schemas/Branding' }
        sections:
          type: array
          items: { $ref: '#/components/schemas/Section' }
        seo: { $ref: '#/components/schemas/SEO' }
        tracking: { $ref: '#/components/schemas/Tracking' }
        published_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LandingUpdateRequest:
      type: object
      required: [branding, sections, seo, tracking]
      properties:
        branding: { $ref: '#/components/schemas/Branding' }
        sections:
          type: array
          items: { $ref: '#/components/schemas/Section' }
        seo: { $ref: '#/components/schemas/SEO' }
        tracking: { $ref: '#/components/schemas/Tracking' }

    LandingListResponse:
      type: object
      required: [landing_pages]
      properties:
        landing_pages:
          type: array
          items: { $ref: '#/components/schemas/LandingPage' }

    PublicHotelContext:
      type: object
      required: [name, slug, timezone, currency]
      properties:
        name: { type: string }
        slug: { type: string }
        timezone: { type: string, example: 'Asia/Bangkok' }
        currency: { type: string, example: 'THB' }

    PublicLandingResponse:
      description: |
        Public landing payload. Inherits every field of `LandingPage` and adds a
        `hotel` block with the timezone + currency the guest UI needs to format
        dates and prices without a second round-trip.
      allOf:
        - $ref: '#/components/schemas/LandingPage'
        - type: object
          required: [hotel]
          properties:
            hotel: { $ref: '#/components/schemas/PublicHotelContext' }

    # ----- pricing / availability -----

    AvailabilityDay:
      type: object
      required: [date, room_type_id, total_inventory, available, closed, rate, currency]
      properties:
        date: { type: string, format: date }
        room_type_id: { type: string, format: uuid }
        total_inventory: { type: integer, minimum: 0 }
        available: { type: integer }
        closed: { type: boolean }
        rate: { type: string, description: Decimal string (e.g. '1500.00') }
        currency: { type: string }
        min_nights: { type: [integer, 'null'], minimum: 1 }
        max_nights: { type: [integer, 'null'], minimum: 1 }
        closed_to_arrival: { type: boolean }
        closed_to_departure: { type: boolean }

    AvailabilityResponse:
      type: object
      required: [hotel_id, start, end, days]
      properties:
        hotel_id: { type: string, format: uuid }
        start: { type: string, format: date }
        end: { type: string, format: date }
        days:
          type: array
          items: { $ref: '#/components/schemas/AvailabilityDay' }

    UpsertAvailabilityItem:
      type: object
      required: [room_type_id, date]
      properties:
        room_type_id: { type: string, format: uuid }
        date: { type: string, format: date }
        inventory_change: { type: integer }
        closed: { type: boolean }
        rate_override: { type: [string, 'null'], description: Decimal string  }
        rate_currency: { type: [string, 'null'] }
        min_nights: { type: [integer, 'null'], minimum: 1 }
        max_nights: { type: [integer, 'null'], minimum: 1 }
        closed_to_arrival: { type: boolean }
        closed_to_departure: { type: boolean }

    UpsertAvailabilityRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UpsertAvailabilityItem' }

    PricingRuleType:
      type: string
      enum: [season, day_of_week, length_of_stay, advance_purchase]

    PricingModifierType:
      type: string
      enum: [percentage, fixed_amount, set_value]

    PricingRule:
      type: object
      required: [id, hotel_id, name, rule_type, modifier_type, modifier_value, priority, enabled, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        hotel_id: { type: string, format: uuid }
        room_type_id: { type: [string, 'null'], format: uuid }
        name: { type: string }
        rule_type: { $ref: '#/components/schemas/PricingRuleType' }
        start_date: { type: [string, 'null'], format: date }
        end_date: { type: [string, 'null'], format: date }
        days_of_week:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
          description: ISO weekday 1..7 (Mon..Sun)
        modifier_type: { $ref: '#/components/schemas/PricingModifierType' }
        modifier_value: { type: string, description: Decimal string }
        min_nights: { type: [integer, 'null'], minimum: 1 }
        max_nights: { type: [integer, 'null'], minimum: 1 }
        min_days_ahead: { type: [integer, 'null'], minimum: 0 }
        max_days_ahead: { type: [integer, 'null'], minimum: 0 }
        priority: { type: integer }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateRuleRequest:
      type: object
      required: [name, rule_type, modifier_type, modifier_value]
      properties:
        room_type_id: { type: [string, 'null'], format: uuid }
        name: { type: string }
        rule_type: { $ref: '#/components/schemas/PricingRuleType' }
        start_date: { type: [string, 'null'], format: date }
        end_date: { type: [string, 'null'], format: date }
        days_of_week:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
        modifier_type: { $ref: '#/components/schemas/PricingModifierType' }
        modifier_value: { type: string }
        min_nights: { type: [integer, 'null'], minimum: 1 }
        max_nights: { type: [integer, 'null'], minimum: 1 }
        min_days_ahead: { type: [integer, 'null'], minimum: 0 }
        max_days_ahead: { type: [integer, 'null'], minimum: 0 }
        priority: { type: [integer, 'null'] }
        enabled: { type: [boolean, 'null'] }

    UpdateRuleRequest:
      type: object
      description: Partial PATCH; only non-null fields are written. Note - room_type_id is intentionally not updatable.
      properties:
        name: { type: [string, 'null'] }
        start_date: { type: [string, 'null'], format: date }
        end_date: { type: [string, 'null'], format: date }
        days_of_week:
          type: [array, 'null']
          items: { type: integer, minimum: 1, maximum: 7 }
        modifier_type: { $ref: '#/components/schemas/PricingModifierType' }
        modifier_value: { type: [string, 'null'] }
        min_nights: { type: [integer, 'null'], minimum: 1 }
        max_nights: { type: [integer, 'null'], minimum: 1 }
        min_days_ahead: { type: [integer, 'null'], minimum: 0 }
        max_days_ahead: { type: [integer, 'null'], minimum: 0 }
        priority: { type: [integer, 'null'] }
        enabled: { type: [boolean, 'null'] }

    RuleListResponse:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items: { $ref: '#/components/schemas/PricingRule' }

    DailyRate:
      type: object
      required: [date, amount, currency]
      properties:
        date: { type: string, format: date }
        amount: { type: string, description: Decimal string }
        currency: { type: string }
        applied_rules:
          type: array
          items: { type: string }

    QuoteRequest:
      type: object
      required: [room_type_id, check_in, check_out, rooms]
      properties:
        room_type_id: { type: string, format: uuid }
        check_in: { type: string, format: date }
        check_out: { type: string, format: date }
        rooms: { type: integer, minimum: 1, maximum: 50 }

    QuoteResponse:
      type: object
      required: [hotel_id, room_type_id, rooms, nights, currency, per_night, subtotal, total]
      properties:
        hotel_id: { type: string, format: uuid }
        room_type_id: { type: string, format: uuid }
        rooms: { type: integer, minimum: 1 }
        nights: { type: integer, minimum: 1 }
        currency: { type: string }
        per_night:
          type: array
          items: { $ref: '#/components/schemas/DailyRate' }
        subtotal: { type: string }
        total: { type: string }
        adjustments:
          type: array
          items: { type: string }

    # ----- booking -----

    BookingStatus:
      type: string
      enum:
        - pending_payment
        - confirmed
        - cancelled
        - expired
        - checked_in
        - checked_out
        - no_show
        - completed

    BookingPaymentStatus:
      type: string
      enum: [pending, paid, refunded, partial, failed]

    BookingSource:
      type: string
      enum: [web, walk_in, phone, admin]

    Booking:
      type: object
      required:
        - id
        - reference
        - hotel_id
        - room_type_id
        - room_count
        - guest_email
        - guest_name
        - check_in_date
        - check_out_date
        - nights
        - currency
        - room_subtotal_cents
        - taxes_cents
        - fees_cents
        - discounts_cents
        - total_cents
        - status
        - payment_status
        - source
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        hotel_id: { type: string, format: uuid }
        room_type_id: { type: string, format: uuid }
        room_count: { type: integer, minimum: 1 }
        guest_email: { type: string, format: email }
        guest_phone: { type: string }
        guest_name: { type: string }
        guest_country: { type: string }
        special_request: { type: string }
        check_in_date: { type: string, format: date }
        check_out_date: { type: string, format: date }
        nights: { type: integer, minimum: 1 }
        currency: { type: string }
        room_subtotal_cents: { type: integer, format: int64, minimum: 0 }
        taxes_cents: { type: integer, format: int64, minimum: 0 }
        fees_cents: { type: integer, format: int64, minimum: 0 }
        discounts_cents: { type: integer, format: int64, minimum: 0 }
        total_cents: { type: integer, format: int64, minimum: 0 }
        status: { $ref: '#/components/schemas/BookingStatus' }
        payment_status: { $ref: '#/components/schemas/BookingPaymentStatus' }
        payment_method: { type: string }
        expires_at: { type: [string, 'null'], format: date-time }
        cancelled_at: { type: [string, 'null'], format: date-time }
        cancelled_by: { type: string }
        cancellation_reason: { type: string }
        source: { $ref: '#/components/schemas/BookingSource' }
        utm_source: { type: string }
        utm_medium: { type: string }
        utm_campaign: { type: string }
        utm_term: { type: string }
        utm_content: { type: string }
        referrer: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        confirmed_at: { type: [string, 'null'], format: date-time }
        checked_in_at: { type: [string, 'null'], format: date-time }
        checked_out_at: { type: [string, 'null'], format: date-time }

    BookingCreateRequest:
      type: object
      required: [room_type_id, room_count, check_in_date, check_out_date, guest_email, guest_name]
      properties:
        room_type_id: { type: string, format: uuid }
        room_count: { type: integer, minimum: 1 }
        check_in_date: { type: string, format: date }
        check_out_date: { type: string, format: date }
        guest_email: { type: string, format: email }
        guest_phone: { type: string }
        guest_name: { type: string }
        guest_country: { type: string }
        special_request: { type: string }
        currency: { type: string }
        room_subtotal_cents: { type: integer, format: int64, minimum: 0 }
        taxes_cents: { type: integer, format: int64, minimum: 0 }
        fees_cents: { type: integer, format: int64, minimum: 0 }
        discounts_cents: { type: integer, format: int64, minimum: 0 }
        total_cents: { type: integer, format: int64, minimum: 0 }
        utm_source: { type: string }
        utm_medium: { type: string }
        utm_campaign: { type: string }
        utm_term: { type: string }
        utm_content: { type: string }
        referrer: { type: string }

    BookingCancelRequest:
      type: object
      properties:
        reason: { type: string }

    PublicBookingCancelRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        reason: { type: string }

    BookingListResponse:
      type: object
      required: [bookings, total]
      properties:
        bookings:
          type: array
          items: { $ref: '#/components/schemas/Booking' }
        total: { type: integer, minimum: 0 }

    # ----- notification -----

    NotificationChannel:
      type: string
      enum: [email, line, sms]

    NotificationTemplate:
      type: string
      enum:
        - booking_created
        - booking_confirmed
        - booking_cancelled
        - booking_check_in_reminder
        - booking_post_stay

    NotificationStatus:
      type: string
      enum: [queued, sending, sent, failed, dead]

    Notification:
      type: object
      required: [id, channel, template, recipient, payload, status, attempts, send_after, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        channel: { $ref: '#/components/schemas/NotificationChannel' }
        template: { $ref: '#/components/schemas/NotificationTemplate' }
        recipient:
          type: string
          description: Email address, LINE user id, or phone number — depends on channel.
        payload:
          type: object
          additionalProperties: true
        related_type: { type: string }
        related_id: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/NotificationStatus' }
        attempts: { type: integer, minimum: 0 }
        last_error: { type: string }
        send_after: { type: string, format: date-time }
        sent_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EnqueueRequest:
      type: object
      required: [recipient]
      properties:
        channel: { $ref: '#/components/schemas/NotificationChannel' }
        template: { $ref: '#/components/schemas/NotificationTemplate' }
        recipient: { type: string }
        payload:
          type: object
          additionalProperties: true
        related_type: { type: string }
        related_id: { type: [string, 'null'], format: uuid }
        send_after: { type: [string, 'null'], format: date-time }

    NotificationListResponse:
      type: object
      required: [notifications, total]
      properties:
        notifications:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        total: { type: integer, minimum: 0 }

    # ----- subscription -----

    SubscriptionStatus:
      type: string
      enum:
        - pending_kyc
        - trialing
        - trial_ending
        - trial_lapsed
        - active
        - past_due
        - suspended
        - cancelled
        - terminated

    SubscriptionProvider:
      type: string
      enum: [stripe, omise]

    Subscription:
      type: object
      required: [id, account_id, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/SubscriptionStatus' }
        plan_code: { type: string }
        billing_cycle: { type: string }
        trial_started_at: { type: [string, 'null'], format: date-time }
        trial_ends_at: { type: [string, 'null'], format: date-time }
        current_period_start: { type: [string, 'null'], format: date-time }
        current_period_end: { type: [string, 'null'], format: date-time }
        room_count_snapshot: { type: [integer, 'null'], minimum: 0 }
        unit_price_cents: { type: [integer, 'null'], format: int64, minimum: 0 }
        currency: { type: string }
        payment_provider: { type: string }
        payment_method_id: { type: string }
        payment_method_last4: { type: string }
        payment_method_brand: { type: string }
        cancelled_at: { type: [string, 'null'], format: date-time }
        cancellation_reason: { type: string }
        suspended_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UpdatePaymentMethodRequest:
      type: object
      required: [provider, method_id]
      properties:
        provider: { $ref: '#/components/schemas/SubscriptionProvider' }
        method_id:
          type: string
          description: Gateway-issued token (Stripe pm_* or Omise tok_*).
        last4: { type: string }
        brand: { type: string }

    SubscriptionCancelRequest:
      type: object
      properties:
        reason: { type: string }

    # ----- uploads -----

    PresignRequest:
      type: object
      required: [kind, content_type, size_bytes]
      properties:
        kind:
          type: string
          enum: [hotel_photo, room_type_photo]
        hotel_id:
          type: [string, 'null']
          format: uuid
          description: Recommended when known; embedded in the object key for
            cleanup-by-prefix. Omit during onboarding wizard's pre-hotel step.
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        size_bytes:
          type: integer
          minimum: 1
          maximum: 10485760
          description: Maximum 10 MiB.

    PresignResponse:
      type: object
      required: [upload_url, object_key, public_url, headers, expires_at]
      properties:
        upload_url:
          type: string
          format: uri
          description: PUT this URL with the file body. Single-use, time-limited.
        object_key:
          type: string
          description: '`{account_id}/{hotel_id|no-hotel}/{kind}/{uuid}.{ext}`'
        public_url:
          type: string
          format: uri
          description: CDN-fronted URL to POST back to the photo CRUD endpoints.
        headers:
          type: object
          additionalProperties: { type: string }
          description: Headers the browser MUST send on the PUT. Currently `Content-Type`.
        expires_at:
          type: string
          format: date-time

    ImgproxyRequest:
      type: object
      required: [source_url]
      properties:
        source_url:
          type: string
          format: uri
          description: Storage URL of the original image (the `public_url` from /presign).
        width: { type: integer, minimum: 0 }
        height: { type: integer, minimum: 0 }
        format:
          type: string
          enum: [webp, jpg, png, '']
          description: Output format. Empty = imgproxy default.
        resize:
          type: string
          enum: [fit, fill, auto, '']
          description: Resize mode. Empty = fit.

    ImgproxyResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri

# ---------------------------------------------------------------------------
# Default security — every operation requires bearerAuth unless it sets
# `security: []` (public endpoints + health probes).
# ---------------------------------------------------------------------------

security:
  - bearerAuth: []
