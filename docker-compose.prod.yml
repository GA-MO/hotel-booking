# Production stack — Hetzner Cloud (Helsinki) + Cloudflare in front.
#
# Usage on the server:
#   cp infra/.env.prod.example .env.prod   # then fill in secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# All app secrets live in .env.prod. Only DOMAIN, registry image refs, and the
# postgres/minio bootstrap creds are referenced at the compose level — the rest
# are injected into the api/worker/web containers via env_file.

name: hotel-booking-prod

x-restart: &restart unless-stopped

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ------------------------------------------------------------------
  # Edge — Caddy (auto Let's Encrypt SSL, reverse proxy)
  # Only this service binds to host ports.
  # ------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: *restart
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-admin@${DOMAIN}}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - booking-web
      - admin-web
      - imgproxy
    networks:
      - hotel_net

  # ------------------------------------------------------------------
  # Go API
  # ------------------------------------------------------------------
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      args:
        TARGET: api
    image: ghcr.io/${GHCR_OWNER:-local}/hotel-booking-api:${IMAGE_TAG:-latest}
    restart: *restart
    logging: *default-logging
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hotel_net
    # No host port — Caddy reaches it via hotel_net at api:8080.

  # ------------------------------------------------------------------
  # Go async worker — same image, different cmd target.
  # ------------------------------------------------------------------
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      args:
        TARGET: worker
    image: ghcr.io/${GHCR_OWNER:-local}/hotel-booking-worker:${IMAGE_TAG:-latest}
    restart: *restart
    logging: *default-logging
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hotel_net

  # ------------------------------------------------------------------
  # booking-web — Next.js (guest booking + landing pages)
  # ------------------------------------------------------------------
  booking-web:
    build:
      context: ./apps/booking-web
      dockerfile: Dockerfile
    image: ghcr.io/${GHCR_OWNER:-local}/hotel-booking-booking-web:${IMAGE_TAG:-latest}
    restart: *restart
    logging: *default-logging
    env_file:
      - .env.prod
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      - api
    networks:
      - hotel_net

  # ------------------------------------------------------------------
  # admin-web — Next.js (hotel admin)
  # ------------------------------------------------------------------
  admin-web:
    build:
      context: ./apps/admin-web
      dockerfile: Dockerfile
    image: ghcr.io/${GHCR_OWNER:-local}/hotel-booking-admin-web:${IMAGE_TAG:-latest}
    restart: *restart
    logging: *default-logging
    env_file:
      - .env.prod
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      - api
    networks:
      - hotel_net

  # ------------------------------------------------------------------
  # Postgres 16 — NOT exposed to host. Reach via psql in-container:
  #   docker compose -f docker-compose.prod.yml exec postgres psql -U hotel
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: *restart
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hotel_booking}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hotel} -d ${POSTGRES_DB:-hotel_booking}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - hotel_net

  # ------------------------------------------------------------------
  # Redis 7 — NOT exposed to host. Appendonly persistence on.
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: *restart
    logging: *default-logging
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory-policy"
      - "allkeys-lru"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - hotel_net

  # ------------------------------------------------------------------
  # MinIO — S3-compatible object storage. NOT exposed to host.
  # The console (9001) is reachable only via the docker network; to view it
  # set up an SSH tunnel from your laptop:
  #   ssh -L 9001:localhost:9001 deploy@<server>
  #   docker compose -f docker-compose.prod.yml exec ... or use a sidecar.
  # ------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    restart: *restart
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - hotel_net

  # One-shot bootstrap — creates the bucket on first boot. Idempotent.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-hotel-booking}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      (mc mb local/$$STORAGE_BUCKET || true) &&
      mc anonymous set download local/$$STORAGE_BUCKET &&
      echo 'MinIO bucket ready.'
      "
    networks:
      - hotel_net
    restart: "no"

  # ------------------------------------------------------------------
  # One-shot DB migrator (profile-gated — does NOT auto-start).
  # Run after a deploy that includes new migration files:
  #   docker compose -f docker-compose.prod.yml --env-file .env.prod \
  #     --profile migrate run --rm migrate up
  # Other useful args: `down 1`, `version`, `force <v>`.
  # ------------------------------------------------------------------
  migrate:
    image: migrate/migrate:v4.18.1
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api/migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-hotel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hotel_booking}?sslmode=disable
    networks:
      - hotel_net
    restart: "no"

  # ------------------------------------------------------------------
  # imgproxy — pulls originals from MinIO, served via img.${DOMAIN}.
  # Set IMGPROXY_KEY / IMGPROXY_SALT in .env.prod to require signed URLs.
  # ------------------------------------------------------------------
  imgproxy:
    image: darthsim/imgproxy:latest
    restart: *restart
    logging: *default-logging
    environment:
      IMGPROXY_BIND: ":8080"
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: "http://minio:9000"
      IMGPROXY_S3_REGION: ${STORAGE_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      IMGPROXY_KEY: ${IMGPROXY_KEY:-}
      IMGPROXY_SALT: ${IMGPROXY_SALT:-}
      IMGPROXY_MAX_SRC_RESOLUTION: "50"
      IMGPROXY_ENFORCE_WEBP: "true"
      IMGPROXY_ENFORCE_AVIF: "true"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - hotel_net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  hotel_net:
    driver: bridge
